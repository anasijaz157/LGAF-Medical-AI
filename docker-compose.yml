version: '3.8'

services:
  lgaf-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lgaf_medical_ai
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
    volumes:
      # Optional: mount models directory directly so large files don't rebuild every time
      - ./models:/app/models:ro
